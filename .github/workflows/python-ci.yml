name: ZERENE Enterprise CI/CD Pipeline 

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # JOB 1: Fast Linting, Formatting, & Static Type Inspection
  # --------------------------------------------------------------------------
  lint-and-quality:
    name:  Lint, Format & Static Type Check
    runs-on: ubuntu-latest
    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name:  Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.20" "mypy==2.1.0" -e .[dev,analytics]
      - name:  Check code formatting & linting with Ruff
        run: |
          ruff check zerene/ tests/
          ruff format --check zerene/ tests/

      - name:  Type checking with Mypy
        run: |
          mypy zerene/ --ignore-missing-imports --no-strict-optional

  # --------------------------------------------------------------------------
  # JOB 2: Comprehensive Multi-OS & Multi-Python Test Matrix
  # --------------------------------------------------------------------------
  matrix-test-suite:
    name:  Unit & Microstructure Tests (${{ matrix.os }} - Py ${{ matrix.python-version }})
    needs: [lint-and-quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name:  Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,analytics]

      - name:  Execute Test Suite (49/49 Unit Tests)
        run: |
          pytest -v --cov=zerene --cov-report=term-missing --cov-report=xml tests/

      - name:  Upload Coverage Artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-xml
          path: coverage.xml
          retention-days: 14

  # --------------------------------------------------------------------------
  # JOB 3: Institutional Throughput & Latency Benchmarks
  # --------------------------------------------------------------------------
  institutional-benchmarks:
    name:  Institutional Microstructure Benchmarks
    needs: [matrix-test-suite]
    runs-on: ubuntu-latest
    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name:  Install ZERENE
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,analytics]

      - name:  Run Single-Threaded Benchmark (50k ops)
        run: |
          python -m zerene benchmark --orders 50000 --workload realistic --format json > bench_single.json

      - name:  Run Multi-Process Symbol Sharding Benchmark (100k ops, 4 shards)
        run: |
          python -m zerene benchmark --orders 100000 --workload realistic --shards 4 --format json > bench_sharded.json

      - name:  Parse & Publish Dynamic Benchmark Job Summary
        run: |
          python .github/scripts/generate_ci_summary.py

  # --------------------------------------------------------------------------
  # JOB 4: Package Build & Installation Verification
  # --------------------------------------------------------------------------
  package-build-check:
    name:  Package Build & Install Verification
    needs: [matrix-test-suite]
    runs-on: ubuntu-latest
    steps:
      - name:  Checkout repository
        uses: actions/checkout@v4

      - name:  Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name:  Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name:  Check package distribution metadata
        run: |
          twine check dist/*

      - name:  Verify wheel installation in clean environment
        run: |
          pip install dist/*.whl
          zerene --help
          python -c "import zerene; print(f'ZERENE Version: {zerene.__version__ if hasattr(zerene, \"__version__\") else \"0.1.0\"}')"

  # --------------------------------------------------------------------------
  # JOB 5: Final Status Gate
  # --------------------------------------------------------------------------
  ci-status-gate:
    name:  ZERENE CI Status Gate
    needs: [lint-and-quality, matrix-test-suite, institutional-benchmarks, package-build-check]
    runs-on: ubuntu-latest
    steps:
      - name:  CI Success Gate
        run: |
          echo "All jobs passed successfully! ZERENE CI Status Gate is GREEN."
